<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone site menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&amp;family=Jost:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-label="Site menu" style="width: 390px; min-height: 844px; box-sizing: border-box; background: #3D0F17; color: #F5E9CB; font-family: 'Jost', sans-serif; font-size: 19px; line-height: 1.5; display: flex; flex-direction: column">

  <div style="padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #5E2430">
    <span style="font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 700">Raj <span style="color: {{accent}}; font-style: italic">Durbar</span></span>
    <button type="button" onClick="{{close}}" style="height: 52px; padding: 0 16px; border: 2px solid #F5E9CB; background: transparent; color: #F5E9CB; font-family: 'Jost', sans-serif; font-size: 18px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>Close</button>
  </div>

  <nav aria-label="Main" style="display: flex; flex-direction: column; padding: 8px 0">
    <sc-for list="{{links}}" as="l" hint-placeholder-count="5">
      <a href="{{l.href}}" aria-current="{{l.ariaCurrent}}" style="{{l.style}}"><span>{{l.label}}</span><span aria-hidden="true" style="font-family: 'Jost', sans-serif; font-size: 24px">→</span></a>
    </sc-for>
  </nav>

  <div style="padding: 20px; display: flex; flex-direction: column; gap: 12px">
    <a href="https://3554.letsorder.uk/" style="min-height: 58px; background: {{accent}}; color: #3D0F17; text-decoration: none; font-size: 19px; font-weight: 600; display: flex; align-items: center; justify-content: center">Order online</a>
    <a href="tel:01932348400" style="min-height: 58px; border: 2px solid {{accent}}; color: {{accent}}; text-decoration: none; font-size: 19px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>Call 01932 348400</a>
  </div>

  <div style="margin-top: auto; padding: 24px 20px; background: #4E1620; display: flex; flex-direction: column; gap: 4px">
    <span style="font-weight: 600; color: {{accent}}">Open today</span>
    <span style="font-size: 22px; font-weight: 600">{{todayHours}}</span>
    <span style="color: #E6D3A8; font-size: 18px">31 The Broadway, New Haw, Addlestone KT15 3EU</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8C878","options":["#E8C878","#D9B45A","#F1E2B8"]},"current":{"editor":"enum","options":["home","menu","book","story","find"],"default":"home"},"onClose":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#E8C878';
    const current = this.props.current ?? 'home';
    const items = [
      { id: 'home', label: 'Home', href: 'PhoneSpiceNight.dc.html' },
      { id: 'menu', label: 'Food menu', href: 'PhoneMenu.dc.html' },
      { id: 'book', label: 'Book a table', href: 'PhoneBook.dc.html' },
      { id: 'story', label: 'Our story', href: 'PhoneStory.dc.html' },
      { id: 'find', label: 'Find us & opening hours', href: 'PhoneFindUs.dc.html' }
    ];
    const links = items.map((i) => {
      const on = i.id === current;
      return {
        label: i.label,
        href: i.href,
        ariaCurrent: on ? 'page' : 'false',
        style: 'min-height: 72px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; border-bottom: 1px solid #5E2430; font-family: Cormorant Garamond, serif; font-size: 32px; font-weight: 700; color: ' + (on ? accent : '#F5E9CB') + '; background: ' + (on ? '#4E1620' : 'transparent') + '; border-left: 6px solid ' + (on ? accent : 'transparent')
      };
    });
    const todayLabels = ['5–10 pm', '5:30–10:30 pm', '5:30–10:30 pm', '5:30–10:30 pm', '5:30–10:30 pm', '5–11 pm', '5–11 pm'];
    return {
      accent,
      links,
      todayHours: todayLabels[new Date().getDay()],
      close: () => { if (this.props.onClose) this.props.onClose(); }
    };
  }
}
</script>
</body>
</html>
